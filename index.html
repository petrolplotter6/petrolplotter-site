<!-- React 18 + Babel standalone (JSX in-browser, no build step).

     opened directly as file:// instead of served over http(s). Every
     utility class below is hand-authored static CSS instead, so the page
     has zero runtime dependency on a JIT compiler. -->

<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  /* =====================================================================
     PETROL PLOTTER 2.0: forest green & antique gold (per design mockups)
     ===================================================================== */
  :root {
    --ink: #0a140f; --forest: #0f261b; --forest2: #15321f; --gold: #c9a961;
    --gold-soft: rgba(201,169,97,.35); --cream: #f1e9d8; --parchment: #ebe2cd; --parch-ink: #1a2a20;
  }
  .font-display { font-family: "Cinzel", "Playfair Display", serif; }

  /* buttons */
  .btn-gold, .btn-gold-solid {
    display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
    font-family: "Inter", sans-serif; font-size: .72rem; font-weight: 600; letter-spacing: .18em; text-transform: uppercase;
    padding: .85rem 1.6rem; min-height: 44px; border-radius: 2px; border: 1px solid var(--gold);
    transition: background-color .2s, color .2s, border-color .2s;
  }
  .btn-gold { color: var(--gold); background: rgba(10,20,15,.35); }
  .btn-gold:hover { background: var(--gold); color: var(--ink); }
  .btn-gold-solid { color: var(--ink); background: var(--gold); }
  .btn-gold-solid:hover { background: #d8bc7a; border-color: #d8bc7a; }
  .btn-gold-solid:disabled, .btn-gold:disabled { opacity: .7; cursor: default; }
  .pp-btn-dark { color: var(--forest); border-color: var(--forest); background: transparent; }
  .pp-btn-dark:hover { background: var(--forest); color: var(--cream); }
  .pp-link { color: rgba(241,233,216,.8); font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; padding: .85rem .25rem; }
  .pp-link:hover { color: var(--gold); }

  /* ornaments */
  .pp-wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
  .pp-rule { display: flex; align-items: center; gap: 7px; width: 170px; margin: 22px 0; }
  .pp-rule span { flex: 1; height: 1px; background: var(--gold-soft); }
  .pp-rule i { width: 5px; height: 5px; background: var(--gold); transform: rotate(45deg); }
  .pp-rule.center { margin-left: auto; margin-right: auto; }

  /* top nav (sits over the hero) */
  .pp-nav { position: absolute; top: 0; left: 0; right: 0; z-index: 20; }
  .pp-nav-inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 88px; }
  .pp-brand { display: flex; align-items: center; gap: 12px; }
  .pp-brand-name { display: block; font-family: "Cinzel", serif; font-size: 1.15rem; letter-spacing: .12em; color: var(--cream); text-transform: uppercase; line-height: 1.1; }
  .pp-brand-sub { display: block; font-size: .6rem; letter-spacing: .28em; text-transform: uppercase; color: var(--gold); margin-top: 3px; }
  .pp-nav-links { display: none; gap: 34px; }
  .pp-nav-links button { font-size: .7rem; letter-spacing: .2em; text-transform: uppercase; color: rgba(241,233,216,.8); padding: 8px 0; border-bottom: 1px solid transparent; }
  .pp-nav-links button:hover { color: var(--gold); border-bottom-color: var(--gold); }
  .pp-nav-cta { padding: .6rem 1rem; font-size: .65rem; }

  /* hero */
  .pp-hero { position: relative; min-height: 92vh; display: flex; align-items: flex-end; overflow: hidden; background: radial-gradient(ellipse at 70% 40%, #1d3a2a 0%, var(--ink) 70%); }
  .pp-hero-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 20%; filter: saturate(.8) brightness(.8); }
  .pp-hero-photo { display: none; position: relative; margin: 0; }
  .pp-hero-photo::before { content: ""; position: absolute; top: -16px; left: 16px; right: -16px; bottom: 16px; border: 1px solid rgba(201,169,97,.28); pointer-events: none; }
  .pp-hero-photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,20,15,0) 55%, rgba(10,20,15,.45) 100%), linear-gradient(90deg, rgba(10,20,15,.25) 0%, rgba(10,20,15,0) 30%); pointer-events: none; }
  .pp-hero-photo img { position: relative; display: block; width: 100%; height: auto; border: 1px solid rgba(201,169,97,.35); box-shadow: 0 40px 70px -35px rgba(0,0,0,.95); filter: saturate(.85) brightness(.95); }
  .pp-hero-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,20,15,.75) 0%, rgba(10,20,15,.25) 30%, rgba(10,20,15,.85) 72%, var(--ink) 100%); }
  .pp-hero-content { position: relative; z-index: 1; width: 100%; padding-top: 120px; padding-bottom: 64px; }
  .pp-eyebrow { font-size: .68rem; letter-spacing: .32em; text-transform: uppercase; color: var(--gold); margin-bottom: 18px; }
  .pp-hero-title { font-family: "Cinzel", serif; font-weight: 500; color: var(--gold); font-size: clamp(3rem, 11vw, 6.6rem); line-height: .98; letter-spacing: .02em; text-transform: uppercase; text-shadow: 0 2px 30px rgba(0,0,0,.45); }
  .pp-hero-sub { font-family: "Cinzel", serif; color: var(--cream); font-size: clamp(1rem, 2.6vw, 1.45rem); letter-spacing: .16em; text-transform: uppercase; line-height: 1.5; margin-top: 18px; }
  .pp-hero-body { color: rgba(241,233,216,.82); font-size: .98rem; font-weight: 300; line-height: 1.7; max-width: 30rem; }
  .pp-hero-ctas { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 22px; margin-top: 30px; }

  /* feature row */
  .pp-features { background: var(--forest); border-top: 1px solid rgba(201,169,97,.18); border-bottom: 1px solid rgba(201,169,97,.18); }
  .pp-feature-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); }
  .pp-feature { text-align: center; padding: 44px 14px; border-color: rgba(201,169,97,.2); border-style: solid; border-width: 0; }
  .pp-feature:nth-child(odd) { border-right-width: 1px; }
  .pp-feature:nth-child(-n+2) { border-bottom-width: 1px; }
  .pp-feature svg { width: 44px; height: 44px; margin: 0 auto 18px; color: var(--gold); }
  .pp-feature h3 { font-family: "Cinzel", serif; font-weight: 500; font-size: .82rem; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; }
  .pp-feature p { font-size: .82rem; line-height: 1.6; color: rgba(241,233,216,.72); max-width: 15rem; margin: 0 auto; }

  /* upcoming rallies (parchment band) */
  .pp-parchment { background: var(--parchment); color: var(--parch-ink); padding: 72px 0 80px; }
  .pp-heading-rule { display: flex; align-items: center; gap: 18px; justify-content: center; }
  .pp-heading-rule span { flex: 0 1 90px; height: 1px; background: rgba(26,42,32,.35); }
  .pp-heading-rule h2 { font-family: "Cinzel", serif; font-weight: 500; font-size: clamp(1.1rem, 3vw, 1.5rem); letter-spacing: .18em; text-transform: uppercase; color: var(--forest); text-align: center; }
  .pp-section-lede { text-align: center; font-size: .92rem; color: rgba(26,42,32,.72); margin: 14px auto 40px; max-width: 34rem; line-height: 1.6; }
  .pp-rally-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
  .pp-card { display: block; width: 100%; text-align: center; background: var(--forest); border: 1px solid rgba(201,169,97,.3); box-shadow: 0 14px 30px -18px rgba(10,20,15,.8); transition: transform .25s, box-shadow .25s; }
  .pp-card:hover { transform: translateY(-3px); box-shadow: 0 22px 36px -18px rgba(10,20,15,.9); }
  .pp-card-img { position: relative; aspect-ratio: 4 / 3; overflow: hidden; background: linear-gradient(135deg, #1d3a2a, var(--ink)); }
  .pp-card-img img { width: 100%; height: 100%; object-fit: cover; filter: saturate(.85); transition: transform .5s; }
  .pp-card:hover .pp-card-img img { transform: scale(1.04); }
  .pp-card-placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: .55; }
  .pp-card-tag { position: absolute; top: 10px; left: 10px; background: rgba(10,20,15,.8); color: var(--gold); border: 1px solid var(--gold-soft); font-size: .6rem; letter-spacing: .18em; text-transform: uppercase; padding: 4px 8px; }
  .pp-card-body { padding: 20px 16px 22px; }
  .pp-card-body h3 { font-family: "Cinzel", serif; font-weight: 500; font-size: .95rem; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); line-height: 1.35; }
  .pp-card-date { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--cream); margin-top: 10px; }
  .pp-card-place { font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; color: rgba(241,233,216,.6); margin-top: 6px; }
  .pp-empty { text-align: center; font-size: .95rem; color: rgba(26,42,32,.7); padding: 24px 0; }

  /* quote + footer */
  .pp-quote { background: var(--ink); padding: 84px 0 70px; text-align: center; }
  .pp-quote blockquote { font-family: "Cinzel", serif; color: var(--gold); font-size: clamp(1rem, 2.8vw, 1.45rem); letter-spacing: .12em; line-height: 1.7; text-transform: uppercase; margin: 0 auto; max-width: 44rem; }
  .pp-quote .pp-quote-mark { font-family: "Cormorant Garamond", serif; font-size: 3rem; color: var(--gold); line-height: 1; margin-bottom: 6px; }
  .pp-footer { background: var(--ink); border-top: 1px solid rgba(201,169,97,.18); padding: 40px 0 44px; text-align: center; }
  .pp-footer svg { margin: 0 auto 10px; }
  .pp-footer-name { font-family: "Cinzel", serif; letter-spacing: .2em; text-transform: uppercase; color: var(--cream); font-size: .9rem; }
  .pp-footer-meta { font-size: .65rem; letter-spacing: .24em; text-transform: uppercase; color: rgba(241,233,216,.55); margin-top: 8px; }
  .pp-footer-copy { font-size: .7rem; color: rgba(241,233,216,.4); margin-top: 18px; }

  /* auth screen back link */
  .pp-back { position: absolute; top: 16px; left: 16px; z-index: 5; font-size: .7rem; letter-spacing: .18em; text-transform: uppercase; color: var(--cream); background: rgba(10,20,15,.55); border: 1px solid var(--gold-soft); padding: 10px 14px; min-height: 40px; }
  .pp-back:hover { color: var(--gold); border-color: var(--gold); }

  /* signed-in app: keep content readable on wide screens */
  .pp-app { max-width: 1180px; margin: 0 auto; }
  .pp-app-hero { height: 168px; }

  @media (min-width: 768px) {
    .pp-nav-links { display: flex; }
    .pp-nav-cta { padding: .75rem 1.3rem; font-size: .7rem; }
    .pp-hero { align-items: center; }
    .pp-hero-bg { display: none; }
    .pp-hero-content { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 64px; align-items: center; }
    .pp-hero-photo { display: block; }
    .pp-hero-title { font-size: clamp(3rem, 6.4vw, 6.2rem); }
    .pp-hero-shade { background: linear-gradient(90deg, rgba(10,20,15,.94) 0%, rgba(10,20,15,.7) 42%, rgba(10,20,15,.15) 100%), linear-gradient(180deg, rgba(10,20,15,.6) 0%, transparent 25%, transparent 80%, var(--ink) 100%); }
    .pp-feature-grid { grid-template-columns: repeat(4, minmax(0,1fr)); }
    .pp-feature { border-width: 0 !important; padding: 56px 22px; }
    .pp-feature + .pp-feature { border-left-width: 1px !important; }
    .pp-app-hero { height: 260px; }
    .md\:grid-cols-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .md\:grid-cols-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
  }
  @media (min-width: 1024px) {
    .lg\:grid-cols-4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
  }
  @media (max-width: 420px) {
    .pp-brand-sub { display: none; }
    .pp-brand-name { font-size: .95rem; }
  }
</style>

<body class="font-sans bg-charcoal text-cream min-h-screen">
<div id="root"></div>

<!-- Watchdog: runs before React/Babel are even guaranteed to have loaded.
     If a CDN script is blocked (network/firewall/ad-blocker) or a runtime
     error slips past everything else, #root would otherwise stay an empty
     div with zero explanation. This renders a visible, actionable message
     instead of a blank page, and gets out of the way the moment React
     successfully mounts. -->
<script>
  (function () {
    function showFallback(reason) {
      var root = document.getElementById('root');
      if (!root || root.children.length > 0) return; // React already mounted, don't clobber it
      root.innerHTML =
        '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Inter,sans-serif;background:#0a140f;color:#F5EFE3;">' +
        '<div style="max-width:380px;text-align:center;">' +
        '<div style="font-size:36px;margin-bottom:12px;">&#9888;&#65039;</div>' +
        '<h1 style="font-size:18px;font-weight:700;margin-bottom:8px;">Petrol Plotter couldn’t start</h1>' +
        '<p style="font-size:14px;color:#B9B2A4;line-height:1.5;margin-bottom:12px;">' + reason + '</p>' +
        '<p style="font-size:12px;color:#726C60;">Open the browser console (F12) for the full error, or try opening this file in a different browser.</p>' +
        '</div></div>';
    }
    window.addEventListener('error', function (e) {
      if (e.target && e.target !== window && e.target.tagName === 'SCRIPT') {
        showFallback('A required script failed to load (' + (e.target.src || 'unknown') + '). Check your internet connection — this app loads React, Firebase and Babel from a CDN and needs network access the first time.');
      } else {
        showFallback('A script error occurred: ' + (e.message || 'unknown error') + '.');
      }
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      showFallback('An unexpected error occurred: ' + (e.reason && e.reason.message ? e.reason.message : e.reason) + '.');
    });
    setTimeout(function () {
      showFallback('The app did not finish loading in time. This usually means a CDN script (React, Firebase or Babel) was blocked.');
    }, 6000);
  })();
</script>

/* ---- Google Sheet CMS feed ----
   RALLIES above stays as a built-in fallback so the app always renders
   something even if the sheet is unreachable. When SHEET_CSV_URL is filled
   in, App fetches it on load and — if it parses successfully — replaces the
   fallback with the live sheet data instead.

   How to get the URL: open the Google Sheet → File → Share → Publish to
   web → choose the events tab → format "Comma-separated values (.csv)" →
   Publish. Paste the resulting URL below. */

const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRBtfp7viGpKX6INmrBN7M3IPRh_bRlvrSpx9VPol-HP-khpVzhu4vGP7dhLVgRZVxt6ewCl1Kk-wl5/pub?output=csv';

// Minimal RFC 4180 CSV parser: handles quoted fields, embedded commas,
// escaped "" quotes, and \r\n / \n line endings. Good enough for a Sheets
// "Publish to web" CSV export without pulling in a library.
function parseCSV(text) {
  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else { inQuotes = false; }
      } else {
        field += c;
      }
    } else if (c === '"') {
      inQuotes = true;
    } else if (c === ',') {
      row.push(field); field = '';
    } else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(field); field = '';
      if (row.some((v) => v !== '')) rows.push(row);
      row = [];
    } else {
      field += c;
    }
  }
  if (field !== '' || row.length) { row.push(field); if (row.some((v) => v !== '')) rows.push(row); }
  if (!rows.length) return [];
  const headers = rows[0].map((h) => h.trim());
  return rows.slice(1).map((r) => {
    const obj = {};
    headers.forEach((h, idx) => { obj[h] = (r[idx] || '').trim(); });
    return obj;
  });
}

// A sheet cell value that's blank or literally "TBD" stays a string (shown
// as-is in the UI); anything numeric-looking becomes a real number so
// formatting/sorting keeps working.
function parseSheetNumber(value) {
  if (!value || value.toUpperCase() === 'TBD') return 'TBD';
  const n = Number(String(value).replace(/[^\d.]/g, ''));
  return Number.isNaN(n) ? 'TBD' : n;
}

const SHEET_COUNTRY_MAP = { NL: 'NL', BE: 'BE', UK: 'UK' };

function mapSheetRowToRally(row, index) {
  const start = row['Start Date'];
  const end = row['End Date'] || start;
  let durationDays = 1;
  const startMs = Date.parse(start);
  const endMs = Date.parse(end);
  if (!Number.isNaN(startMs) && !Number.isNaN(endMs)) {
    durationDays = Math.max(1, Math.round((endMs - startMs) / 86400000) + 1);
  }
  return {
    id: 'sheet_' + index,
    country: SHEET_COUNTRY_MAP[row['Country']] || 'OTHER',
    title: row['Title'],
    date: start,
    endDate: end,
    durationDays,
    distanceKm: parseSheetNumber(row['Distance (km)']),
    fee: parseSheetNumber(row['Entry Fee']),
    currency: row['Currency'] || 'EUR',
    location: row['Location'] || '',
    category: row['Category'] || '',
    source: { name: row['Source Name'] || 'Source', url: row['Source URL'] || '#' },
    imageUrl: row['Image URL'] || '',
  };
}

// Fetches and parses the published sheet. Resolves to null (never rejects)
// on any failure — the caller always has a safe fallback to fall back to.
async function fetchRalliesFromSheet() {
  if (!SHEET_CSV_URL || SHEET_CSV_URL.indexOf('PASTE_YOUR') === 0) return null;
  try {
    const res = await fetch(SHEET_CSV_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const rows = parseCSV(text);
    const mapped = rows
      .map(mapSheetRowToRally)
      .filter((r) => r.title && r.date);
    return mapped.length ? mapped : null;
  } catch (e) {
    console.error('Could not load rallies from the Google Sheet, using built-in data instead:', e);
    return null;
  }
}

/* ---- Firebase-backed persistence ----
   Real accounts, shared across every device: Auth handles sign-up/sign-in,
   Firestore stores each user's profile and rally registrations. Firebase's
   own session persistence (IndexedDB under the hood) survives reloads on
   its own, so there's no manual localStorage/session-key bookkeeping here
   anymore — onAuthStateChanged below is the single source of truth. */

const USERS_COLLECTION = 'users';
const REGISTRATIONS_COLLECTION = 'registrations';

// Firebase auth error codes → friendly, human copy for the AuthScreen.
function mapAuthError(error) {
  const code = error && error.code;
  switch (code) {
    case 'auth/invalid-email': return 'That email address doesn’t look right.';
    case 'auth/user-not-found':
    case 'auth/wrong-password':
    case 'auth/invalid-credential': return 'Incorrect email or password. Please try again.';
    case 'auth/email-already-in-use': return 'An account with this email already exists.';
    case 'auth/weak-password': return 'Password should be at least 6 characters.';
    case 'auth/too-many-requests': return 'Too many attempts. Please wait a moment and try again.';
    case 'auth/network-request-failed': return 'Network error — check your internet connection.';
    default: return (error && error.message) || 'Something went wrong. Please try again.';
  }
}

/* ---------------------------- formatting helpers ---------------------------- */

function formatDate(iso) {
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}

// "22 – 24 Aug 2026" when a rally spans days within one month, otherwise full dates.
function formatDateRange(startIso, endIso) {
  if (!endIso || endIso === startIso) return formatDate(startIso);
  const a = new Date(startIso + 'T00:00:00');
  const b = new Date(endIso + 'T00:00:00');
  if (Number.isNaN(a.getTime()) || Number.isNaN(b.getTime())) return formatDate(startIso);
  if (a.getMonth() === b.getMonth() && a.getFullYear() === b.getFullYear()) {
    return a.getDate() + ' – ' + formatDate(endIso);
  }
  return formatDate(startIso) + ' – ' + formatDate(endIso);
}

function formatFee(amount, currency) {
  if (amount === 'TBD' || amount === null || amount === undefined || amount === '') return 'TBD';
  const symbol = currency === 'GBP' ? '£' : '€';
  return symbol + Number(amount).toLocaleString('en-GB');
}

function isUpcoming(rally) {
  return rally.date >= TODAY;
}

function rallySource(rally) {
  return rally.source || COUNTRIES[rally.country].source;
}

/* ---------------------------- mock GPX + roadbook ---------------------------- */

const COUNTRY_ORIGIN = {
  NL: [52.1, 5.3], BE: [50.6, 4.7], UK: [52.5, -1.9], OTHER: [48.4, 7.2],
};

function generateGPX(rally) {
  const [lat, lon] = COUNTRY_ORIGIN[rally.country];
  const pts = [0, 0.4, 0.8, 1].map((f, i) => {
    const jLat = (lat + f * 0.6 + Math.sin(i) * 0.05).toFixed(5);
    const jLon = (lon + f * 0.8 + Math.cos(i) * 0.05).toFixed(5);
    return `  <wpt lat="${jLat}" lon="${jLon}"><name>${i === 0 ? 'Start' : i === 3 ? 'Finish' : 'Checkpoint ' + i}</name></wpt>`;
  }).join('\n');
  return `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Petrol Plotter (mock)" xmlns="http://www.topografix.com/GPX/1/1">\n<metadata><name>${rally.title}</name></metadata>\n${pts}\n</gpx>`;
}

function downloadGPX(rally) {
  const blob = new Blob([generateGPX(rally)], { type: 'application/gpx+xml' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = rally.title.replace(/[^\w]+/g, '_') + '.gpx';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function generateRoadbook(rally) {
  const legs = Math.max(3, rally.durationDays * 2);
  const perLeg = Math.round(rally.distanceKm / legs);
  const notes = ['Fuel stop advised', 'Scenic detour, reduced speed', 'Photo control point', 'Regularity section', 'Lunch halt', 'Technical inspection'];
  return Array.from({ length: legs }, (_, i) => ({
    leg: i + 1,
    label: i === 0 ? 'Départ' : i === legs - 1 ? 'Arrivée' : `Leg ${i + 1}`,
    km: perLeg,
    note: notes[i % notes.length],
  }));
}

/* =========================================================================
   VINTAGE MOTIFS — faint carved/embossed background ornaments (wire-spoke
   wheel + wooden three-spoke steering wheel) shared by the login screen and
   every subsequent page. Pure inline SVG, no external image dependency.
   The "embossed" look comes from a matched pair of drop-shadows: a dark
   shadow toward the lower-right (recessed edge) and a faint cream highlight
   toward the upper-left (catching light), applied via CSS filter — the same
   trick used for engraved metal / tooled leather in print design.
   ========================================================================= */

const EMBOSS_FILTER =
  'drop-shadow(1.5px 2px 0.5px rgba(0,0,0,0.55)) drop-shadow(-1px -1px 0.5px rgba(245,239,227,0.06))';

function WireSpokeWheel({ spokes = 32 }) {
  const cx = 200, cy = 200, hub = 34, rim = 172, rimInner = 156;
  const lines = [];
  for (let i = 0; i < spokes; i++) {
    const a = (i / spokes) * Math.PI * 2;
    lines.push(
      <line
        key={i}
        x1={cx + Math.cos(a) * hub} y1={cy + Math.sin(a) * hub}
        x2={cx + Math.cos(a) * rimInner} y2={cy + Math.sin(a) * rimInner}
        stroke="currentColor" strokeWidth="1.5"
      />
    );
  }
  return (
    <svg viewBox="0 0 400 400" fill="none" style={{ width: '100%', height: '100%', color: 'rgb(245,239,227)', filter: EMBOSS_FILTER }}>
      <circle cx={cx} cy={cy} r={rim} stroke="currentColor" strokeWidth="6" />
      <circle cx={cx} cy={cy} r={rimInner} stroke="currentColor" strokeWidth="2" />
      {lines}
      <circle cx={cx} cy={cy} r={hub} stroke="currentColor" strokeWidth="5" />
      <circle cx={cx} cy={cy} r={hub - 12} stroke="currentColor" strokeWidth="2" fill="currentColor" fillOpacity="0.08" />
    </svg>
  );
}

function WoodSteeringWheel() {
  const cx = 200, cy = 200, rim = 168, boss = 46;
  const spokeAngles = [90, 210, 330]; // classic three-spoke layout
  return (
    <svg viewBox="0 0 400 400" fill="none" style={{ width: '100%', height: '100%', color: 'rgb(245,239,227)', filter: EMBOSS_FILTER }}>
      {/* wooden rim, laminated look via double stroke */}
      <circle cx={cx} cy={cy} r={rim} stroke="currentColor" strokeWidth="16" />
      <circle cx={cx} cy={cy} r={rim} stroke="currentColor" strokeWidth="2" strokeDasharray="2 6" opacity="0.5" />
      <circle cx={cx} cy={cy} r={rim - 14} stroke="currentColor" strokeWidth="1.5" opacity="0.6" />
      {spokeAngles.map((deg) => {
        const a = (deg * Math.PI) / 180;
        return (
          <line
            key={deg}
            x1={cx + Math.cos(a) * boss} y1={cy + Math.sin(a) * boss}
            x2={cx + Math.cos(a) * (rim - 10)} y2={cy + Math.sin(a) * (rim - 10)}
            stroke="currentColor" strokeWidth="14" strokeLinecap="round"
          />
        );
      })}
      <circle cx={cx} cy={cy} r={boss} stroke="currentColor" strokeWidth="4" fill="currentColor" fillOpacity="0.1" />
      <circle cx={cx} cy={cy} r={boss - 16} stroke="currentColor" strokeWidth="2" opacity="0.7" />
    </svg>
  );
}

function AuthScreen({ onLogin, onSignup, initialMode = 'login', onBack }) {
  const [mode, setMode] = useState(initialMode); // 'login' | 'signup'
  const [form, setForm] = useState({ email: '', password: '', name: '', carModel: '', carYear: '' });
  const [status, setStatus] = useState('idle'); // idle | loading | error
  const [errorMsg, setErrorMsg] = useState('');

  function update(field, value) {
    setForm((f) => ({ ...f, [field]: value }));
  }

  async function submit(e) {
    e.preventDefault();
    setStatus('loading');
    setErrorMsg('');
    // No artificial delay here anymore — the real Firebase network call
    // provides its own natural loading time. On success, App's
    // onAuthStateChanged listener flips currentUser and this screen
    // unmounts on its own; we only need to handle the failure case here.
    const res = mode === 'login'
      ? await onLogin(form.email.trim(), form.password)
      : await onSignup(form);
    if (!res.ok) {
      setStatus('error');
      setErrorMsg(res.error);
    }

/* =========================================================================
   DISCOVER VIEW
   ========================================================================= */

const FILTERS = ['ALL', 'NL', 'UK', 'BE', 'OTHER'];
const FILTER_LABEL = { ALL: 'All', NL: '🇳🇱 NL', UK: '🇬🇧 EN', BE: '🇧🇪 BE', OTHER: '🌍 Other' };

function DiscoverView({ rallies, registrations, onRegister }) {
  const [filter, setFilter] = useState('ALL');

  const visible = useMemo(() => {
    const list = filter === 'ALL' ? rallies : rallies.filter((r) => r.country === filter);
    // Upcoming first (soonest on top), then past events (most recent first).
    const upcoming = list.filter(isUpcoming).sort((a, b) => a.date.localeCompare(b.date));
    const past = list.filter((r) => !isUpcoming(r)).sort((a, b) => b.date.localeCompare(a.date));
    return [...upcoming, ...past];
  }, [rallies, filter]);

  return (
    <div className="fade-in">
      <div className="relative pp-app-hero">
        <img onError={(e) => { e.currentTarget.style.display = 'none'; }} src={HERO_IMAGES.mountainRoad} alt="" className="absolute inset-0 w-full h-full object-cover" />
        <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(180deg, rgba(11,70,39,.35) 0%, rgba(10,20,15,.35) 60%, rgb(10,20,15) 100%)' }}></div>
        <div className="absolute bottom-0 left-0 right-0 px-4 pb-3">
          <p className="text-[10px] uppercase tracking-widest text-gold mb-1">Elegance · Performance · Adventure</p>
          <h2 className="font-serif text-2xl font-semibold text-cream leading-tight uppercase">Plot the Road. Live the Legend.</h2>
        </div>
      </div>

      <div className="px-4 pt-3 pb-3 flex gap-2 overflow-x-auto scrollbar-hide sticky top-[64px] bg-charcoal z-20">
        {FILTERS.map((f) => (
          <button
            key={f}
            onClick={() => setFilter(f)}
            className={`shrink-0 px-4 py-2 min-h-[44px] rounded-full text-sm font-semibold border transition-colors ${
              filter === f ? 'bg-gold/15 border-gold text-gold' : 'bg-panel border-white/10 text-silver'
            }`}
          >
            {FILTER_LABEL[f]}
          </button>
        ))}
      </div>

      <div className="px-4 pb-6 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
        {visible.length === 0 && (
          <p className="text-silver-dim text-sm text-center py-12" style={{ gridColumn: '1 / -1' }}>No rallies in this region yet.</p>
        )}
        {visible.map((r, i) => (
          <RallyShowcaseCard
            key={r.id}
            rally={r}
            index={i}
            registered={registrations.some((reg) => reg.rallyId === r.id)}
            onRegister={onRegister}
            past={!isUpcoming(r)}
          />
        ))}
      </div>
    </div>
  );
}

        {tab === 'discover' && <DiscoverView rallies={rallies} registrations={registrations} onRegister={onRegister} />}
        {tab === 'garage' && <GarageView myRallies={myRallies} onCancel={onCancel} onGPX={downloadGPX} onRoadbook={setRoadbookRally} />}
        {tab === 'profile' && <ProfileView user={user} onLogout={onLogout} registrationCount={myRallies.length} />}
      </main>

      <nav className="fixed bottom-0 left-0 right-0 z-30 bg-panel border-t border-gold/20 flex items-stretch pb-[env(safe-area-inset-bottom)]">
        {TABS.map((t) => (
          <button
            key={t.key}
            onClick={() => setTab(t.key)}
            className="flex-1 flex flex-col items-center justify-center gap-1 py-2.5 min-h-[56px] relative"
          >
            {tab === t.key && <span className="absolute top-0 left-1/2 -translate-x-1/2 w-8 h-0.5 bg-gold rounded-full"></span>}
            <span className={tab === t.key ? 'text-gold' : 'text-silver-dim'}>{t.icon('w-5 h-5')}</span>
            <span className={`text-[10px] font-semibold ${tab === t.key ? 'text-cream' : 'text-silver-dim'}`}>{t.label}</span>
          </button>
        ))}
      </nav>

      <RoadbookModal rally={roadbookRally} onClose={() => setRoadbookRally(null)} />
      <Toast message={toast} onDone={() => setToast('')} />
    </div>
  );
}

/* =========================================================================
   SETUP REQUIRED SCREEN — shown instead of a cryptic Firebase error when
   window.FIREBASE_CONFIG still has its placeholder values.
   ========================================================================= */

function SetupRequiredScreen() {
  return (
    <div className="min-h-screen flex flex-col justify-center px-6 py-10 fade-in">
      <div className="max-w-sm w-full mx-auto text-center">
        <div className="text-4xl mb-4">🔧</div>
        <h1 className="font-serif text-2xl font-bold text-cream mb-3">Firebase setup required</h1>
        <p className="text-silver text-sm mb-4">
          This app needs a Firebase project to handle accounts and registrations.
          Open this file and fill in the <span className="text-cream font-medium">window.FIREBASE_CONFIG</span> object
          (near the top of &lt;body&gt;) with the config values from your Firebase project.
        </p>
        <p className="text-silver-dim text-xs">
          Find them in the Firebase console under Project settings → General → Your apps.
          Full setup steps were provided alongside this file.
        </p>
      </div>
    </div>
  );
}

/* =========================================================================
   ROOT APP — owns auth state (Firebase Authentication), the live
   registrations list (Firestore), and the rally catalog itself (fetched
   from the published Google Sheet, falling back to the built-in RALLIES
   if the sheet isn't configured or unreachable).
   ========================================================================= */

function App() {
  const [currentUser, setCurrentUser] = useState(null); // { id, email, profile } | null
  const [authLoading, setAuthLoading] = useState(true); // true until the first onAuthStateChanged fires
  const [registrations, setRegistrations] = useState([]);
  const [toast, setToast] = useState('');
  const [rallies, setRallies] = useState(RALLIES); // instant render with built-in data
  const [authView, setAuthView] = useState(null); // null = public landing page | 'login' | 'signup'

  // Load rally data from the published Google Sheet, if configured. Renders
  // the built-in RALLIES immediately either way, then swaps in the live
  // sheet data once (if) it arrives — never blocks the first paint on a
  // network request, and silently keeps the fallback if the fetch fails.
  useEffect(() => {
    let cancelled = false;
    fetchRalliesFromSheet().then((sheetRallies) => {
      if (!cancelled && sheetRallies) setRallies(sheetRallies);
    });
    return () => { cancelled = true; };
  }, []);

  // Auth session — Firebase persists this itself (IndexedDB), so it
  // survives reloads with zero manual bookkeeping on our side.
  useEffect(() => {
    if (!window.__FIREBASE_CONFIGURED__) {
      setAuthLoading(false);
      return;
    }
    const unsubscribe = firebase.auth().onAuthStateChanged(
      async (fbUser) => {
        if (!fbUser) {
          setCurrentUser(null);
          setAuthLoading(false);
          return;
        }
        let profile = { name: '', carModel: '', carYear: '' };
        try {
          const doc = await firebase.firestore().collection(USERS_COLLECTION).doc(fbUser.uid).get();
          if (doc.exists) profile = doc.data();
        } catch (e) {
          console.error('Failed to load profile:', e);
        }
        setCurrentUser({ id: fbUser.uid, email: fbUser.email, profile });
        setAuthLoading(false);
      },
      (error) => {
        console.error('Auth state error:', error);
        setAuthLoading(false);
      }
    );
    return () => unsubscribe();
  }, []);

  // Live registrations for whoever is currently signed in. onSnapshot keeps
  // this in sync in real time — e.g. registering on one device updates the
  // Garage view on another without a manual refresh.
  useEffect(() => {
    if (!currentUser) {
      setRegistrations([]);
      return;
    }
    const unsubscribe = firebase.firestore()
      .collection(REGISTRATIONS_COLLECTION)
      .where('userId', '==', currentUser.id)
      .onSnapshot(
        (snap) => setRegistrations(snap.docs.map((d) => ({ id: d.id, ...d.data() }))),
        (error) => console.error('Registrations listener error:', error)
      );
    return () => unsubscribe();
  }, [currentUser]);

  async function login(email, password) {
    try {
      await firebase.auth().signInWithEmailAndPassword(email, password);
      return { ok: true };
    } catch (e) {
      return { ok: false, error: mapAuthError(e) };
    }
  }

  async function signup(form) {
    if (!form.email || !form.password) {
      return { ok: false, error: 'Email and password are required.' };
    }
    try {
      const cred = await firebase.auth().createUserWithEmailAndPassword(form.email.trim(), form.password);
      const profile = { name: form.name.trim(), carModel: form.carModel.trim(), carYear: form.carYear.trim() };
      await firebase.firestore().collection(USERS_COLLECTION).doc(cred.user.uid).set(profile);
      return { ok: true };
    } catch (e) {
      return { ok: false, error: mapAuthError(e) };
    }
  }

  function logout() {
    setAuthView(null); // back to the public landing page
    firebase.auth().signOut().catch((e) => console.error('Sign out failed:', e));
  }

  const register = useCallback((rallyId) => {
    if (!currentUser || registrations.some((r) => r.rallyId === rallyId)) return;
    firebase.firestore().collection(REGISTRATIONS_COLLECTION).add({
      userId: currentUser.id, rallyId, registeredAt: TODAY,
    }).catch((e) => console.error('Register failed:', e));
    const rally = rallies.find((r) => r.id === rallyId);
    setToast(rally ? `You're registered for ${rally.title}` : 'Registered');
  }, [currentUser, registrations, rallies]);

  const cancelRegistration = useCallback((rallyId) => {
    const reg = registrations.find((r) => r.rallyId === rallyId);
    if (!reg) return;
    firebase.firestore().collection(REGISTRATIONS_COLLECTION).doc(reg.id).delete()
      .catch((e) => console.error('Cancel failed:', e));
    setToast('Registration cancelled');
  }, [registrations]);

  if (!window.__FIREBASE_CONFIGURED__) {
    return <SetupRequiredScreen />;
  }

  if (authLoading) {
    return (
      <div className="min-h-screen flex items-center justify-center">
        <span className="spinner"></span>
      </div>
    );
  }

  if (!currentUser) {
    if (authView) {
      return <AuthScreen key={authView} initialMode={authView} onBack={() => setAuthView(null)} onLogin={login} onSignup={signup} />;
    }
    return <LandingPage rallies={rallies} onEnter={(m) => { setAuthView(m); window.scrollTo(0, 0); }} />;
  }

  return (
    <Dashboard
      user={currentUser}
      rallies={rallies}
      registrations={registrations}
      onRegister={register}
      onCancel={cancelRegistration}
      onLogout={logout}
      toast={toast}
      setToast={setToast}
    />
  );
}

/* =========================================================================
   ERROR BOUNDARY — catches render-time exceptions in the React tree.
   Without this, React 18 silently unmounts the entire app on an uncaught
   error, leaving a blank page. This shows the actual error instead.
   ========================================================================= */

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  componentDidCatch(error, info) {
    console.error('Petrol Plotter crashed:', error, info);
  }
  render() {
    if (this.state.error) {
      return (
        <div className="min-h-screen flex items-center justify-center px-6 text-center">
          <div className="max-w-sm">
            <div className="text-4xl mb-3">⚠️</div>
            <h1 className="font-serif text-xl font-bold text-cream mb-2">Something went wrong</h1>
            <p className="text-silver text-sm mb-3">{String(this.state.error.message || this.state.error)}</p>
            <p className="text-silver-dim text-xs">Reload the page to try again. Open the browser console for full details.</p>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <ErrorBoundary><App /></ErrorBoundary>
);
</script>
