<div id="root"></div>

<!-- Watchdog: runs before React/Babel are even guaranteed to have loaded.
     If a CDN script is blocked (network/firewall/ad-blocker) or a runtime
     error slips past everything else, #root would otherwise stay an empty
     div with zero explanation. This renders a visible, actionable message
     instead of a blank page, and gets out of the way the moment React
     successfully mounts. -->
<script>
  (function () {
    function showFallback(reason) {
      var root = document.getElementById('root');
      if (!root || root.children.length > 0) return; // React already mounted, don't clobber it
      root.innerHTML =
        '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Inter,sans-serif;background:#121212;color:#F5EFE3;">' +
        '<div style="max-width:380px;text-align:center;">' +
        '<div style="font-size:36px;margin-bottom:12px;">&#9888;&#65039;</div>' +
        '<h1 style="font-size:18px;font-weight:700;margin-bottom:8px;">Petrol Plotter couldn’t start</h1>' +
        '<p style="font-size:14px;color:#B9B2A4;line-height:1.5;margin-bottom:12px;">' + reason + '</p>' +
        '<p style="font-size:12px;color:#726C60;">Open the browser console (F12) for the full error, or try opening this file in a different browser.</p>' +
        '</div></div>';
    }
    window.addEventListener('error', function (e) {
      if (e.target && e.target !== window && e.target.tagName === 'SCRIPT') {
        showFallback('A required script failed to load (' + (e.target.src || 'unknown') + '). Check your internet connection — this app loads React, Firebase and Babel from a CDN and needs network access the first time.');
      } else {
        showFallback('A script error occurred: ' + (e.message || 'unknown error') + '.');
      }
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      showFallback('An unexpected error occurred: ' + (e.reason && e.reason.message ? e.reason.message : e.reason) + '.');
    });
    setTimeout(function () {
      showFallback('The app did not finish loading in time. This usually means a CDN script (React, Firebase or Babel) was blocked.');
    }, 6000);
  })();
</script>

    source: { name: 'Classic Events', url: 'https://classicevents.nl/' } },

/* ---- Firebase-backed persistence ----
   Real accounts, shared across every device: Auth handles sign-up/sign-in,
   Firestore stores each user's profile and rally registrations. Firebase's
   own session persistence (IndexedDB under the hood) survives reloads on
   its own, so there's no manual localStorage/session-key bookkeeping here
   anymore — onAuthStateChanged below is the single source of truth. */

const USERS_COLLECTION = 'users';
const REGISTRATIONS_COLLECTION = 'registrations';

// Firebase auth error codes → friendly, human copy for the AuthScreen.
function mapAuthError(error) {
  const code = error && error.code;
  switch (code) {
    case 'auth/invalid-email': return 'That email address doesn’t look right.';
    case 'auth/user-not-found':
    case 'auth/wrong-password':
    case 'auth/invalid-credential': return 'Incorrect email or password. Please try again.';
    case 'auth/email-already-in-use': return 'An account with this email already exists.';
    case 'auth/weak-password': return 'Password should be at least 6 characters.';
    case 'auth/too-many-requests': return 'Too many attempts. Please wait a moment and try again.';
    case 'auth/network-request-failed': return 'Network error — check your internet connection.';
    default: return (error && error.message) || 'Something went wrong. Please try again.';
  }
}

/* ---------------------------- formatting helpers ---------------------------- */

function formatDate(iso) {
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}

function formatFee(amount, currency) {
  const symbol = currency === 'GBP' ? '£' : '€';
  return symbol + amount.toLocaleString('en-GB');
}

function isUpcoming(rally) {
  return rally.date >= TODAY;
}

function rallySource(rally) {
  return rally.source || COUNTRIES[rally.country].source;
}

/* ---------------------------- mock GPX + roadbook ---------------------------- */

const COUNTRY_ORIGIN = {
  NL: [52.1, 5.3], BE: [50.6, 4.7], UK: [52.5, -1.9], OTHER: [48.4, 7.2],
};

function generateGPX(rally) {
  const [lat, lon] = COUNTRY_ORIGIN[rally.country];
  const pts = [0, 0.4, 0.8, 1].map((f, i) => {
    const jLat = (lat + f * 0.6 + Math.sin(i) * 0.05).toFixed(5);
    const jLon = (lon + f * 0.8 + Math.cos(i) * 0.05).toFixed(5);
    return `  <wpt lat="${jLat}" lon="${jLon}"><name>${i === 0 ? 'Start' : i === 3 ? 'Finish' : 'Checkpoint ' + i}</name></wpt>`;
  }).join('\n');
  return `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Petrol Plotter (mock)" xmlns="http://www.topografix.com/GPX/1/1">\n<metadata><name>${rally.title}</name></metadata>\n${pts}\n</gpx>`;
}

function downloadGPX(rally) {
  const blob = new Blob([generateGPX(rally)], { type: 'application/gpx+xml' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = rally.title.replace(/[^\w]+/g, '_') + '.gpx';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function generateRoadbook(rally) {
  const legs = Math.max(3, rally.durationDays * 2);
  const perLeg = Math.round(rally.distanceKm / legs);
  const notes = ['Fuel stop advised', 'Scenic detour, reduced speed', 'Photo control point', 'Regularity section', 'Lunch halt', 'Technical inspection'];
  return Array.from({ length: legs }, (_, i) => ({
    leg: i + 1,
    label: i === 0 ? 'Départ' : i === legs - 1 ? 'Arrivée' : `Leg ${i + 1}`,
    km: perLeg,
    note: notes[i % notes.length],
  }));
}

function Toast({ message, onDone }) {
  useEffect(() => {

    return () => clearTimeout(t);

  return (

function AuthScreen({ onLogin, onSignup }) {
  const [mode, setMode] = useState('login'); // 'login' | 'signup'
  const [form, setForm] = useState({ email: '', password: '', name: '', carModel: '', carYear: '' });
  const [status, setStatus] = useState('idle'); // idle | loading | error
  const [errorMsg, setErrorMsg] = useState('');

  function update(field, value) {
    setForm((f) => ({ ...f, [field]: value }));
  }

  async function submit(e) {
    e.preventDefault();
    setStatus('loading');
    setErrorMsg('');
    // No artificial delay here anymore — the real Firebase network call
    // provides its own natural loading time. On success, App's
    // onAuthStateChanged listener flips currentUser and this screen
    // unmounts on its own; we only need to handle the failure case here.
    const res = mode === 'login'
      ? await onLogin(form.email.trim(), form.password)
      : await onSignup(form);
    if (!res.ok) {
      setStatus('error');
      setErrorMsg(res.error);
    }
  }

  return (
    <div className="min-h-screen flex flex-col justify-center px-6 py-10 fade-in">
      <div className="max-w-sm w-full mx-auto">

          {['login', 'signup'].map((m) => (
            <button
              key={m}
              type="button"
              onClick={() => { setMode(m); setStatus('idle'); setErrorMsg(''); }}
              className={`flex-1 py-2.5 rounded-lg text-sm font-semibold capitalize transition-colors min-h-[44px] ${mode === m ? 'bg-racing text-cream' : 'text-silver'}`}
            >
              {m === 'login' ? 'Log In' : 'Sign Up'}
            </button>
          ))}
        </div>

        <form onSubmit={submit} className={`space-y-4 ${status === 'error' ? 'shake' : ''}`}>
          <div>
            <label className="block text-xs uppercase tracking-wide text-silver-dim mb-1.5">Email</label>
            <input
              type="email" required value={form.email}
              onChange={(e) => update('email', e.target.value)}
              placeholder="you@example.com"
              className="w-full bg-panel border border-white/10 rounded-lg px-4 py-3 text-cream placeholder-silver-dim focus:outline-none focus:border-crimson min-h-[44px]"
            />
          </div>
          <div>
            <label className="block text-xs uppercase tracking-wide text-silver-dim mb-1.5">Password</label>
            <input
              type="password" required value={form.password}
              onChange={(e) => update('password', e.target.value)}
              placeholder="••••••••"
              className="w-full bg-panel border border-white/10 rounded-lg px-4 py-3 text-cream placeholder-silver-dim focus:outline-none focus:border-crimson min-h-[44px]"
            />
          </div>

          {mode === 'signup' && (
            <div className="pt-2 border-t border-white/5">
              <p className="text-xs uppercase tracking-wide text-silver-dim mb-3 mt-3">Driver / Navigator Profile <span className="normal-case text-silver-dim/70">(optional)</span></p>
              <div className="space-y-3">
                <input
                  type="text" value={form.name} onChange={(e) => update('name', e.target.value)}
                  placeholder="Name"
                  className="w-full bg-panel border border-white/10 rounded-lg px-4 py-3 text-cream placeholder-silver-dim focus:outline-none focus:border-crimson min-h-[44px]"
                />
                <input
                  type="text" value={form.carModel} onChange={(e) => update('carModel', e.target.value)}
                  placeholder="Classic Car Model (e.g. Jaguar E-Type)"
                  className="w-full bg-panel border border-white/10 rounded-lg px-4 py-3 text-cream placeholder-silver-dim focus:outline-none focus:border-crimson min-h-[44px]"

      </div>
    </div>
  );
}

/* =========================================================================
   ROOT APP — owns auth state (Firebase Authentication) and the live
   registrations list (Firestore). RALLIES itself stays static mock data —
   swap it for the Google Sheet / scraper feed later without touching auth.
   ========================================================================= */

function App() {
  const [currentUser, setCurrentUser] = useState(null); // { id, email, profile } | null
  const [authLoading, setAuthLoading] = useState(true); // true until the first onAuthStateChanged fires
  const [registrations, setRegistrations] = useState([]);
  const [toast, setToast] = useState('');

  // Auth session — Firebase persists this itself (IndexedDB), so it
  // survives reloads with zero manual bookkeeping on our side.
  useEffect(() => {
    if (!window.__FIREBASE_CONFIGURED__) {
      setAuthLoading(false);
      return;
    }
    const unsubscribe = firebase.auth().onAuthStateChanged(
      async (fbUser) => {
        if (!fbUser) {
          setCurrentUser(null);
          setAuthLoading(false);
          return;
        }
        let profile = { name: '', carModel: '', carYear: '' };
        try {
          const doc = await firebase.firestore().collection(USERS_COLLECTION).doc(fbUser.uid).get();
          if (doc.exists) profile = doc.data();
        } catch (e) {
          console.error('Failed to load profile:', e);
        }
        setCurrentUser({ id: fbUser.uid, email: fbUser.email, profile });
        setAuthLoading(false);
      },
      (error) => {
        console.error('Auth state error:', error);
        setAuthLoading(false);
      }
    );
    return () => unsubscribe();
  }, []);

  // Live registrations for whoever is currently signed in. onSnapshot keeps
  // this in sync in real time — e.g. registering on one device updates the
  // Garage view on another without a manual refresh.
  useEffect(() => {
    if (!currentUser) {
      setRegistrations([]);
      return;
    }
    const unsubscribe = firebase.firestore()
      .collection(REGISTRATIONS_COLLECTION)
      .where('userId', '==', currentUser.id)
      .onSnapshot(
        (snap) => setRegistrations(snap.docs.map((d) => ({ id: d.id, ...d.data() }))),
        (error) => console.error('Registrations listener error:', error)
      );
    return () => unsubscribe();
  }, [currentUser]);

  async function login(email, password) {
    try {
      await firebase.auth().signInWithEmailAndPassword(email, password);
      return { ok: true };
    } catch (e) {
      return { ok: false, error: mapAuthError(e) };
    }
  }

  async function signup(form) {
    if (!form.email || !form.password) {
      return { ok: false, error: 'Email and password are required.' };
    }
    try {
      const cred = await firebase.auth().createUserWithEmailAndPassword(form.email.trim(), form.password);
      const profile = { name: form.name.trim(), carModel: form.carModel.trim(), carYear: form.carYear.trim() };
      await firebase.firestore().collection(USERS_COLLECTION).doc(cred.user.uid).set(profile);
      return { ok: true };
    } catch (e) {
      return { ok: false, error: mapAuthError(e) };
    }
  }

  function logout() {
    firebase.auth().signOut().catch((e) => console.error('Sign out failed:', e));
  }

  const register = useCallback((rallyId) => {
    if (!currentUser || registrations.some((r) => r.rallyId === rallyId)) return;
    firebase.firestore().collection(REGISTRATIONS_COLLECTION).add({
      userId: currentUser.id, rallyId, registeredAt: TODAY,
    }).catch((e) => console.error('Register failed:', e));
    const rally = RALLIES.find((r) => r.id === rallyId);
    setToast(`You're registered for ${rally.title}`);
  }, [currentUser, registrations]);

  const cancelRegistration = useCallback((rallyId) => {
    const reg = registrations.find((r) => r.rallyId === rallyId);
    if (!reg) return;
    firebase.firestore().collection(REGISTRATIONS_COLLECTION).doc(reg.id).delete()
      .catch((e) => console.error('Cancel failed:', e));
    setToast('Registration cancelled');
  }, [registrations]);

  if (!window.__FIREBASE_CONFIGURED__) {
    return <SetupRequiredScreen />;
  }

  if (authLoading) {
    return (
      <div className="min-h-screen flex items-center justify-center">
        <span className="spinner"></span>
      </div>
    );
  }

  if (!currentUser) {
    return <AuthScreen onLogin={login} onSignup={signup} />;
  }

  return (
    <Dashboard
      user={currentUser}
      registrations={registrations}
      onRegister={register}
      onCancel={cancelRegistration}
      onLogout={logout}
      toast={toast}
      setToast={setToast}
    />
  );
}

/* =========================================================================
   ERROR BOUNDARY — catches render-time exceptions in the React tree.
   Without this, React 18 silently unmounts the entire app on an uncaught
   error, leaving a blank page. This shows the actual error instead.
   ========================================================================= */

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  componentDidCatch(error, info) {
    console.error('Petrol Plotter crashed:', error, info);
  }
  render() {
    if (this.state.error) {
      return (
        <div className="min-h-screen flex items-center justify-center px-6 text-center">
          <div className="max-w-sm">
            <div className="text-4xl mb-3">⚠️</div>
            <h1 className="font-serif text-xl font-bold text-cream mb-2">Something went wrong</h1>
            <p className="text-silver text-sm mb-3">{String(this.state.error.message || this.state.error)}</p>
            <p className="text-silver-dim text-xs">Reload the page to try again. Open the browser console for full details.</p>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <ErrorBoundary><App /></ErrorBoundary>
);
</script>
